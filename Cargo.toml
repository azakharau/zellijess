[package]
name = "zellijess"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Zellij navigation and preview workflow inspired by tmux choose-tree and fzf-preview."
repository = "https://github.com/azakharau/zellijess"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
ansi-to-tui = "7"
